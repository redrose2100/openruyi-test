set timeout=60
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Install openEuler-os_version with GUI mode' --class red --class gnu-linux --class gnu --class os {
	load_video
    insmod part_msdos
    insmod fat
	set root=(tftp,172.168.131.94)
	linux /openEuler_os_version_phy/latest/images/pxeboot/vmlinuz ro rd.iscsi.waitnet=0 inst.geoloc=0 inst.ks=http://NODE1_IPV4/anaconda-ks-base.cfg rd.debug systemd.log_level=info systemd.log_target=console
	initrd /openEuler_os_version_phy/latest/images/pxeboot/initrd.img
}

